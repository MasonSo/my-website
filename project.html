<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mason So</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 1.75rem;
      left: 2.5rem;
      z-index: 50;
    }

    #project-content {
      max-width: 860px;
      margin: 0 auto;
      padding: 5.5rem 2.5rem 6rem;
    }

    .project-header {
      margin-bottom: 2.25rem;
    }

    .project-title-text {
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3.8rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      margin: 0 0 0.75rem 0;
      line-height: 1.1;
    }

    .project-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.04em;
      flex-wrap: wrap;
    }

    .meta-dot {
      color: rgba(255, 255, 255, 0.18);
    }

    .project-description {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.58);
      line-height: 1.75;
      max-width: 58ch;
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="home.html" class="back-link">← Back</a>
  </nav>

  <img src="images/logo.personal.png" class="site-logo" alt="Mason So" />

  <main id="project-content">
    <!-- Rendered by script.js -->
  </main>

  <script src="script.js"></script>
</body>
</html>
