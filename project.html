<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mason So</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #080808;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 1.75rem;
      left: 3rem;
      z-index: 50;
    }

    #project-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 6.5rem 3.5rem 7rem;
    }

    /* Project header */
    .project-header {
      margin-bottom: 3.25rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .project-title-text {
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(2rem, 5vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      margin: 0 0 1rem 0;
      line-height: 1.05;
      color: rgba(255,255,255,0.92);
    }

    .project-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
    }

    .meta-dot { color: rgba(255,255,255,0.15); }

    .project-description {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.82;
      max-width: 60ch;
      margin-bottom: 2.5rem;
    }

    @media (max-width: 640px) {
      nav { left: 1.5rem; }
      #project-content { padding: 5rem 1.5rem 5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="home.html" class="back-link">&#8592; Back</a>
  </nav>

  <img src="images/logo.personal.png" class="site-logo" alt="Mason So" />

  <main id="project-content">
    <!-- Rendered by script.js -->
  </main>

  <script src="script.js"></script>
</body>
</html>
