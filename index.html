<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mason So</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #080808;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    #flow-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    /* Fades only at the bottom to keep text readable */
    #scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        transparent 42%,
        rgba(8,8,8,0.65) 72%,
        rgba(8,8,8,0.96) 100%
      );
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 3.5rem 2.75rem;
      opacity: 0;
      transform: translateY(16px);
      animation: revealUp 1.1s cubic-bezier(0.16,1,0.3,1) 1.2s forwards;
    }

    @keyframes revealUp {
      to { opacity: 1; transform: none; }
    }

    #overlay-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.48rem, 0.65vw, 0.68rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin: 0 0 1rem 0;
    }

    #name-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 1.1rem;
      gap: 2rem;
    }

    #overlay-name {
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(3rem, 7.5vw, 10.5rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      margin: 0;
      line-height: 1;
      color: rgba(255,255,255,0.92);
      flex-shrink: 0;
    }

    #enter-link {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      text-decoration: none;
      padding-bottom: 0.12rem;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      transition: color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: 0.35rem;
      align-self: flex-end;
    }
    #enter-link:hover {
      color: rgba(255,255,255,0.88);
      border-color: rgba(255,255,255,0.55);
    }

    @media (max-width: 640px) {
      #overlay { padding: 0 1.75rem 2.25rem; }
      #name-row { flex-direction: column; align-items: flex-start; gap: 1.2rem; }
      #enter-link { margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <canvas id="flow-canvas"></canvas>
  <div id="scrim"></div>

  <div id="overlay">
    <p id="overlay-tagline">3D Design &nbsp; Video Production &nbsp; Creative Code &nbsp; Multidisciplinary Art</p>
    <div id="name-row">
      <h1 id="overlay-name">MASON SO</h1>
      <a href="home.html" id="enter-link">Enter &rarr;</a>
    </div>
  </div>

  <script>
    // Particle flow field — pure canvas, no libraries
    // Particles follow a slowly evolving vector field driven by layered sine waves

    const canvas = document.getElementById('flow-canvas');
    const ctx = canvas.getContext('2d');

    let W, H, t = 0;

    const COUNT  = 1000;  // particle count
    const SCALE  = 0.0024; // noise frequency — larger = tighter curls
    const FADE   = 0.022; // trail fade per frame — lower = longer trails

    let pts = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      ctx.fillStyle = '#080808';
      ctx.fillRect(0, 0, W, H);
    }

    // Angle at (x, y) — layered sinusoids approximate smooth noise
    function flowAngle(x, y) {
      const s = t * 0.00065;
      const a =  Math.sin(x * SCALE        + s)        * Math.cos(y * SCALE * 1.28 + s * 0.75);
      const b =  Math.cos(x * SCALE * 2.05 - y * SCALE * 0.82 + s * 1.55);
      const c =  Math.sin((x + y) * SCALE * 0.62       + s * 1.1);
      return (a + b * 0.55 + c * 0.35) * Math.PI * 2.8;
    }

    function spawn() {
      return {
        x:     Math.random() * W,
        y:     Math.random() * H,
        age:   0,
        life:  160 + Math.random() * 340,
        spd:   0.55 + Math.random() * 1.1,
        alpha: 0.18 + Math.random() * 0.28,
      };
    }

    function init() {
      pts = Array.from({ length: COUNT }, spawn);
      // Stagger ages so field is already populated on first frame
      pts.forEach(p => { p.age = Math.floor(Math.random() * p.life); });
    }

    function frame() {
      // Soft erase — creates the trailing streaks
      ctx.fillStyle = `rgba(8,8,8,${FADE})`;
      ctx.fillRect(0, 0, W, H);

      ctx.lineWidth = 1.1;

      for (const p of pts) {
        const a   = flowAngle(p.x, p.y);
        const nx  = p.x + Math.cos(a) * p.spd;
        const ny  = p.y + Math.sin(a) * p.spd;

        // Fade in and out over lifetime
        const fade = Math.min(p.age / 30, 1) * Math.min((p.life - p.age) / 30, 1);
        const opa  = p.alpha * fade;

        if (opa > 0.004) {
          ctx.strokeStyle = `rgba(255,255,255,${opa.toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(nx, ny);
          ctx.stroke();
        }

        p.x = nx;
        p.y = ny;
        p.age++;

        if (p.x < -2 || p.x > W + 2 || p.y < -2 || p.y > H + 2 || p.age >= p.life) {
          Object.assign(p, spawn());
        }
      }

      t++;
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    init();
    frame();
  </script>
</body>
</html>
