<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mason So</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #080808;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    #particle-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #particle-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Gradient: vivid at top, heavy at bottom for text legibility */
    #scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.22) 0%,
        rgba(0,0,0,0.45) 45%,
        rgba(0,0,0,0.88) 78%,
        rgba(0,0,0,0.97) 100%
      );
      pointer-events: none;
    }

    /* Overlay anchored to bottom */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 3.5rem 2.75rem;
      opacity: 0;
      transform: translateY(16px);
      animation: revealUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
    }

    @keyframes revealUp {
      to { opacity: 1; transform: none; }
    }

    #overlay-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.48rem, 0.65vw, 0.68rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin: 0 0 1rem 0;
    }

    #name-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 1.1rem;
      gap: 2rem;
    }

    #overlay-name {
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(3rem, 7.5vw, 10.5rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      margin: 0;
      line-height: 1;
      color: rgba(255,255,255,0.92);
      flex-shrink: 0;
    }

    #enter-link {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      text-decoration: none;
      padding-bottom: 0.12rem;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      transition: color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: 0.35rem;
      align-self: flex-end;
    }
    #enter-link:hover {
      color: rgba(255,255,255,0.88);
      border-color: rgba(255,255,255,0.55);
    }

    @media (max-width: 640px) {
      #overlay {
        padding: 0 1.75rem 2.25rem;
      }
      #name-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.2rem;
      }
      #enter-link {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>
  <div id="scrim"></div>

  <div id="overlay">
    <p id="overlay-tagline">3D Design &nbsp; Video Production &nbsp; Creative Code &nbsp; Multidisciplinary Art</p>
    <div id="name-row">
      <h1 id="overlay-name">MASON SO</h1>
      <a href="home.html" id="enter-link">Enter &rarr;</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
  <script src="particles.js" defer></script>
</body>
</html>
