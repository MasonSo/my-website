<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mason So</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    #particle-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #particle-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Dark scrim so text reads over the image reel */
    #scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(0, 0, 0, 0.68);
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1.4s ease 1.8s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    #overlay-name {
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(2.2rem, 5vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      margin: 0 0 0.6rem 0;
      text-align: center;
      text-indent: 0.35em;
    }

    #overlay-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.55rem, 0.85vw, 0.8rem);
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.65);
      margin: 0 0 3rem 0;
      text-align: center;
      text-indent: 0.22em;
    }

    #enter-link {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.65rem 1.6rem 0.6rem;
      text-indent: 0.22em;
      transition: color 0.25s, border-color 0.25s;
    }

    #enter-link:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>
  <div id="scrim"></div>

  <div id="overlay">
    <h1 id="overlay-name">MASON SO</h1>
    <p id="overlay-tagline">3D Design &nbsp;·&nbsp; Video Production &nbsp;·&nbsp; Creative Code</p>
    <a href="home.html" id="enter-link">Enter Portfolio</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
  <script src="particles.js" defer></script>
</body>
</html>
